# Default Workbench keybindings.
# Contexts inherit from `vim.normal` (and `global`), so rebinding a motion or
# operator under `vim.normal` updates notebook, cell, and output levels together.

[keys.global]
"app.quit" = ["ctrl+q"]
"app.palette" = ["ctrl+/"]
"app.settings" = ["ctrl+,"]
"kernel.interrupt" = ["ctrl+c"]
"ui.toggle_mouse_capture" = ["alt+m"]

[keys."vim.normal"]
"motion.down" = ["j", "down"]
"motion.up" = ["k", "up"]
"motion.top" = ["g g", "home"]
"motion.bottom" = ["G", "end"]
"motion.half_page_down" = ["ctrl+d", "pagedown"]
"motion.half_page_up" = ["ctrl+u", "pageup"]
"op.delete" = ["d"]
"op.yank" = ["y"]
"edit.paste_after" = ["p"]
"edit.paste_before" = ["P"]
"edit.undo" = ["u"]
"edit.redo" = ["ctrl+r"]
"search.open" = ["/"]
"search.next" = ["n"]
"search.prev" = ["N"]
"focus.up" = ["esc"]
"app.help" = ["?"]
"app.command_bar" = [":"]

[keys."notebook.normal"]
"app.quit" = ["q"]
"doc.save" = ["w"]
"doc.save_force" = ["W"]
"cell.enter_normal" = ["enter", "l"]
"cell.enter_insert" = ["i"]
"cell.append_end" = ["A"]
"cell.insert_below" = ["a", "o"]
"cell.insert_above" = ["b", "O"]
"cell.run" = ["space"]
"cell.run_and_advance" = ["r"]
"cell.run_all" = ["X"]
"cell.toggle_kind" = ["t"]
"cell.toggle_collapse" = ["z a"]
"cell.focus_output" = ["z o"]
"cell.edit_external" = ["ctrl+g"]
"cell.clear_outputs" = ["c"]
"cell.format" = ["f"]
"kernel.restart" = ["R"]
"mark.set" = ["m"]
"mark.jump" = ["'"]

# Motions inside a block of text: a cell's source or an output.
[keys."text.motions"]
"motion.left" = ["h", "left", "backspace"]
"motion.right" = ["l", "right", "space"]
"motion.word_next" = ["w"]
"motion.word_back" = ["b"]
"motion.word_end" = ["e"]
"motion.bigword_next" = ["W"]
"motion.bigword_back" = ["B"]
"motion.bigword_end" = ["E"]
"motion.line_start" = ["0", "home"]
"motion.line_first_nonblank" = ["^"]
"motion.current_line" = ["_"]
"motion.line_end" = ["$", "end"]
"motion.paragraph_next" = ["}"]
"motion.paragraph_prev" = ["{"]
"motion.match_pair" = ["%"]
"motion.find_forward" = ["f"]
"motion.find_backward" = ["F"]
"motion.till_forward" = ["t"]
"motion.till_backward" = ["T"]
"motion.repeat_find" = [";"]
"motion.repeat_find_reverse" = [","]
"edit.yank_line" = ["Y"]
"visual.char" = ["v"]
"visual.line" = ["V"]

[keys."cell.normal"]
"cell.run" = ["enter"]
"cell.enter_insert" = ["i"]
"cell.append_char" = ["a"]
"edit.insert_line_start" = ["I"]
"edit.append_line_end" = ["A"]
"edit.open_below" = ["o"]
"edit.open_above" = ["O"]
"cell.toggle_expand_split" = ["ctrl+o"]
"cell.split_at_cursor" = ["ctrl+\\"]
"cell.edit_external" = ["ctrl+g"]
"op.change" = ["c"]
"op.indent" = [">"]
"op.dedent" = ["<"]
"edit.delete_char" = ["x", "delete"]
"edit.delete_char_back" = ["X"]
"edit.substitute" = ["s"]
"edit.substitute_line" = ["S"]
"edit.delete_to_eol" = ["D"]
"edit.change_to_eol" = ["C"]
"edit.replace_char" = ["r"]
"edit.toggle_case" = ["~"]
"edit.join_lines" = ["J"]
"intel.inspect_doc" = ["K"]

# Operators act on the selection immediately in visual mode.
[keys."cell.visual"]
"visual.swap_ends" = ["o"]
"op.change" = ["c"]
"op.indent" = [">"]
"op.dedent" = ["<"]
"edit.delete_char" = ["x", "delete"]
"edit.substitute" = ["s"]
"edit.substitute_line" = ["S"]
"edit.delete_to_eol" = ["D", "X"]
"edit.change_to_eol" = ["C"]
"edit.replace_char" = ["r"]
"edit.toggle_case" = ["~"]
"edit.join_lines" = ["J"]
"edit.insert_line_start" = ["I"]
"edit.append_line_end" = ["A"]

# Outputs are read-only text: every motion, visual mode, and yank.
[keys."output.normal"]

[keys."output.visual"]
"visual.swap_ends" = ["o"]

[keys."text.pending"]
"textobj.inner_word" = ["i w"]
"textobj.around_word" = ["a w"]
"textobj.inner_bigword" = ["i W"]
"textobj.around_bigword" = ["a W"]
"textobj.inner_dquote" = ["i \""]
"textobj.around_dquote" = ["a \""]
"textobj.inner_squote" = ["i '"]
"textobj.around_squote" = ["a '"]
"textobj.inner_backtick" = ["i `"]
"textobj.around_backtick" = ["a `"]
"textobj.inner_paren" = ["i (", "i )", "i b"]
"textobj.around_paren" = ["a (", "a )", "a b"]
"textobj.inner_bracket" = ["i [", "i ]"]
"textobj.around_bracket" = ["a [", "a ]"]
"textobj.inner_brace" = ["i {", "i }", "i B"]
"textobj.around_brace" = ["a {", "a }", "a B"]
"textobj.inner_angle" = ["i <", "i >"]
"textobj.around_angle" = ["a <", "a >"]
"textobj.inner_paragraph" = ["i p"]
"textobj.around_paragraph" = ["a p"]

# Editing keys shared by every multi-line text entry (cell insert, pdb input).
# Alt/Option+arrows arrive as alt+b / alt+f, like readline.
[keys."text.insert"]
"edit.backspace" = ["backspace", "ctrl+h"]
"edit.delete_char" = ["delete"]
"edit.delete_word_back" = ["ctrl+w", "alt+backspace", "ctrl+backspace"]
"edit.delete_to_line_start" = ["ctrl+u"]
"edit.delete_to_line_end" = ["ctrl+k"]
"motion.left" = ["left"]
"motion.right" = ["right"]
"motion.up" = ["up"]
"motion.down" = ["down"]
"motion.line_start" = ["home", "ctrl+a"]
"motion.line_end" = ["end", "ctrl+e"]
"motion.word_back" = ["alt+b"]
"motion.word_next" = ["alt+f"]

[keys."cell.insert"]
"focus.up" = ["esc", "j j"]
"edit.newline" = ["enter", "ctrl+j", "alt+enter"]
"intel.complete" = ["tab"]
"cell.toggle_expand_split" = ["ctrl+o"]

[keys."pdb.input"]
"pdb.submit" = ["enter"]
"pdb.newline" = ["ctrl+j", "alt+enter"]
"pdb.history_prev" = ["up"]
"pdb.history_next" = ["down"]
"kernel.interrupt" = ["ctrl+c"]
